services:
  - type: web
    name: festivalquote-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./festivalquote.db
      - key: ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
