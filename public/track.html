<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track request — FestivalQuote</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="nav"><a class="brand" href="/">Festival<span>Quote</span></a><a class="navcta" href="/">New request</a></div></header><main><section class="form-card" style="margin-top:30px"><p class="eyebrow">PRIVATE REQUEST TRACKING</p><h1 style="font-size:44px;letter-spacing:-2px">Your festival request</h1><p class="sub" style="font-size:16px">Use the private link you received after submitting your request.</p><div id="out" class="trackbox">Loading…</div></section></main><script>
const p=new URLSearchParams(location.search),id=p.get("id"),token=p.get("token"),out=document.getElementById("out");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function wa(v){let x=(v||"").replace(/\D/g,"");if(x.startsWith("0"))x="91"+x.slice(1);if(x.length===10)x="91"+x;return x}
async function load(){if(!id||!token){out.innerHTML="<p>Invalid tracking link.</p>";return}try{const r=await fetch("/api/track?id="+encodeURIComponent(id)+"&token="+encodeURIComponent(token));const j=await r.json();if(!r.ok)throw Error(j.detail||"Request not found");const x=j.request;
let h='<div class="statusline"><b>Request #'+esc(x.id)+'</b><span class="status '+esc(x.status)+'">'+esc(x.status.replaceAll("_"," "))+'</span></div><p><b>'+esc(x.festival)+'</b> · '+esc(x.service)+' · '+esc(x.city)+' · '+esc(x.event_date)+'</p><p>Budget: '+esc(x.budget)+'</p>';
h+='<h2 style="margin-top:28px">Your options</h2>';
if(!j.quotes.length)h+='<div class="empty">We are still sourcing providers. Check this page again after we contact them.</div>';
else j.quotes.forEach(q=>{const w=wa(q.whatsapp||q.phone);h+='<article class="quote"><div><span class="tag">'+esc(q.availability)+'</span><h3>'+esc(q.provider)+'</h3><p>'+esc(q.package||"Custom package")+'</p><p>'+esc(q.response_note||"")+'</p></div><div class="price">'+(q.price!=null?"₹"+Number(q.price).toLocaleString("en-IN"):"Ask")+(w?'<a href="https://wa.me/'+w+'?text=Hi%2C%20I%20found%20you%20through%20FestivalQuote%20for%20my%20'+encodeURIComponent(x.service)+'%20request." target="_blank" rel="noopener">WhatsApp provider</a>':"")+'</div></article>'});
out.innerHTML=h}catch(e){out.innerHTML="<p>Could not load this request. Check your private tracking link.</p>"}}load();
</script><style>.trackbox{color:#5f5750}.statusline{display:flex;justify-content:space-between;align-items:center}.status{padding:7px 11px;border-radius:999px;background:#f1e6da;color:#783a22;font-size:12px;text-transform:capitalize}.empty{padding:20px;background:#fff;border:1px solid #eadfd3;border-radius:14px}.quote{display:flex;justify-content:space-between;gap:20px;padding:20px;border:1px solid #eadfd3;border-radius:16px;background:#fff;margin:12px 0}.quote h3{margin:8px 0}.quote p{margin:5px 0;color:#70675f}.tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#c96b32;font-weight:900}.price{text-align:right;font-size:24px;font-weight:900;color:#783a22}.price a{display:block;font-size:12px;margin-top:10px;text-decoration:underline}@media(max-width:650px){.quote{display:block}.price{text-align:left;margin-top:15px}}</style></body></html>
