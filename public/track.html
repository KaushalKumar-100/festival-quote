<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Private FestivalQuote request tracker"><title>Track request — FestivalQuote</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header><div class="nav"><a class="brand" href="/">Festival<span>Quote</span></a><div style="display:flex;gap:8px;align-items:center"><a class="secondary mini-cta" href="/my-requests.html">My requests</a><a class="navcta" href="/">New request</a></div></div></header>
<main>
<section class="form-card tracker-card">
  <div class="tracker-head"><div><p class="eyebrow">PRIVATE REQUEST TRACKING</p><h1>Your festival request</h1><p class="sub">This private page updates as FestivalQuote sources and verifies local options.</p></div><button id="refreshBtn" class="secondary" type="button">↻ Refresh</button></div>
  <div id="out" class="trackbox" aria-live="polite"><div class="loading-track"><span class="spinner"></span> Loading your request…</div></div>
</section>
</main>
<div id="editModal" class="edit-modal" hidden role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="edit-card"><div class="tracker-head"><div><p class="eyebrow">UPDATE REQUEST</p><h2 id="editTitle">Edit your request</h2><p class="muted">Changes are saved to the same request number.</p></div><button class="secondary" type="button" onclick="closeEdit()" aria-label="Close edit request dialog">Close</button></div><form id="editForm"><div class="edit-grid"><label>Name<input name="name" required></label><label>Phone / WhatsApp<input name="phone" required></label><label>City<input name="city" required></label><label>Festival<select name="festival"><option>Diwali</option><option>Durga Puja</option><option>Dussehra</option><option>Chhath Puja</option><option>Ganesh Chaturthi</option><option>Navratri</option><option>Other Festival</option></select></label><label>Service<input name="service" required></label><label>Event date<input name="event_date" type="date" required></label><label>Budget<input name="budget" required></label></div><label>Email<input name="email" type="email"></label><label>Requirement details<textarea name="details" rows="5" maxlength="2000"></textarea></label><button class="primary" type="submit">Save changes</button><p id="editMsg" class="msg"></p></form></div></div>
<script>
const p=new URLSearchParams(location.search),id=p.get("id"),token=p.get("token"),out=document.getElementById("out"),refreshBtn=document.getElementById("refreshBtn");
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function wa(v){let x=String(v||"").replace(/\D/g,"");if(x.startsWith("0"))x="91"+x.slice(1);if(x.length===10)x="91"+x;return x}
function label(s){return String(s||"").replaceAll("_"," ").replace(/\b\w/g,m=>m.toUpperCase())}
async function load(){
 if(!id||!token){out.innerHTML='<div class="track-error"><b>Invalid tracking link</b><p>Use the private link you received after submitting your request.</p><a class="secondary" href="/">Create a new request</a></div>';return}
 refreshBtn.disabled=true;refreshBtn.textContent="Refreshing…";
 try{
  const r=await fetch("/api/track?id="+encodeURIComponent(id)+"&token="+encodeURIComponent(token),{cache:"no-store"});
  const text=await r.text();let j;try{j=JSON.parse(text)}catch{throw Error("The service returned an unexpected response.")}
  if(!r.ok)throw Error(j.detail||"Request not found");
  const x=j.request,quotes=j.quotes||[]; window.currentRequest=x;
  let h='<div class="statusline"><div><b>Request #'+esc(x.id)+'</b><p class="muted">'+esc(x.festival)+' · '+esc(x.service)+' · '+esc(x.city)+'</p></div><span class="status '+esc(x.status)+'">'+label(x.status)+'</span></div>';
  h+='<div class="tracker-meta"><div><small>Event date</small><b>'+esc(x.event_date)+'</b></div><div><small>Budget</small><b>'+esc(x.budget)+'</b></div></div>';
  h+='<div class="tracker-actions"><button class="secondary" type="button" onclick="editRequest()">Edit request</button><a class="secondary" href="/my-requests.html">My requests</a><a class="secondary" href="/">Add another request</a></div>';
  h+='<div class="tracker-note">'+(x.status==="new"||x.status==="sourcing"?'We are sourcing relevant providers for your request. This page will show options once they are verified.':x.status==="quotes_ready"?'Your options are ready. Review them below and contact the provider you prefer.':x.status==="booked"?'Your request is marked as booked.':'Your request status is <b>'+label(x.status)+'</b>.')+'</div>';
  h+='<div class="tracker-section"><div class="section-row"><div><p class="eyebrow">YOUR OPTIONS</p><h2>Compare available providers</h2></div><span class="option-count">'+quotes.length+' option'+(quotes.length===1?'':'s')+'</span></div>';
  if(!quotes.length)h+='<div class="empty">No verified options yet.<p>Check this page again after we contact providers.</p><button class="secondary" onclick="load()">Check again</button></div>';
  else quotes.forEach(q=>{const w=wa(q.whatsapp||q.phone),availability=q.availability||"unknown";h+='<article class="quote"><div class="quote-main"><div class="quote-top"><span class="tag">'+esc(availability)+'</span>'+(availability==="available"?'<span class="verified">✓ Verified availability</span>':"")+'</div><h3>'+esc(q.provider)+'</h3><p class="package">'+esc(q.package||"Custom package")+'</p>'+(q.response_note?'<p class="quote-note">'+esc(q.response_note)+'</p>':"")+'</div><div class="price">'+(q.price!=null?"₹"+Number(q.price).toLocaleString("en-IN"):"Ask")+(w?'<a class="secondary mini-cta" href="https://wa.me/'+w+'?text=Hi%2C%20I%20found%20you%20through%20FestivalQuote%20for%20my%20'+encodeURIComponent(x.service)+'%20request." target="_blank" rel="noopener">WhatsApp provider ↗</a>':"")+'</div></article>'});
  h+='</div><p class="tracker-footer">FestivalQuote helps you compare local options. Booking, final pricing and payment are handled directly with the selected provider.</p>';
  out.innerHTML=h;
 }catch(e){out.innerHTML='<div class="track-error"><b>Could not load your request</b><p>'+esc(e.message||"Please try again.")+'</p><button class="secondary" onclick="load()">Try again</button></div>'}
 finally{refreshBtn.disabled=false;refreshBtn.textContent="↻ Refresh"}
}
refreshBtn.addEventListener("click",load);load();
</script>
<style>
.tracker-card{max-width:920px;margin-top:30px}.tracker-head{display:flex;justify-content:space-between;gap:25px;align-items:flex-start}.tracker-head h1{font-size:52px;letter-spacing:-3px;margin:0 0 12px}.tracker-head .sub{font-size:16px}.statusline{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:20px 0;border-bottom:1px solid var(--line)}.status{padding:7px 11px;border-radius:999px;background:#f1e6da;color:#783a22;font-size:12px;text-transform:capitalize;font-weight:900}.tracker-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.tracker-meta div{background:#faf6f1;border:1px solid var(--line);border-radius:13px;padding:13px}.tracker-meta small,.tracker-meta b{display:block}.tracker-meta small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.tracker-meta b{margin-top:4px}.tracker-note{padding:15px;border-radius:13px;background:var(--soft);color:var(--accent2);line-height:1.5}.tracker-section{margin-top:30px}.section-row{display:flex;justify-content:space-between;align-items:end;gap:15px}.section-row h2{font-size:28px}.option-count{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900}.quote{display:flex;justify-content:space-between;gap:25px;padding:21px;border:1px solid var(--line);border-radius:17px;background:#fff;margin:12px 0;box-shadow:0 8px 22px rgba(70,45,25,.04)}.quote-main{min-width:0}.quote-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.quote h3{margin:9px 0 5px;font-size:19px}.quote .package{margin:0;color:var(--ink);font-weight:750}.quote-note{color:var(--muted);line-height:1.5}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:950}.verified{font-size:10px;color:var(--green,#287a55);font-weight:900;background:#e5f3eb;padding:5px 8px;border-radius:999px}.price{text-align:right;font-size:26px;font-weight:950;color:#783a22;white-space:nowrap}.mini-cta{display:block;font-size:11px;padding:9px 10px;margin-top:9px;text-align:center}.empty{padding:28px;background:#fff;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}.empty p{margin:6px 0 15px}.track-error{padding:30px;background:#fff0ee;border:1px solid #f0d0cb;border-radius:15px;color:#8e3028}.track-error p{color:var(--muted)}.loading-track{text-align:center;padding:45px;color:var(--muted)}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e0d5cb;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}.tracker-footer{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:650px){.tracker-head{display:block}.tracker-head .secondary{margin-top:10px}.tracker-head h1{font-size:40px}.statusline{display:block}.statusline .status{display:inline-block;margin-top:10px}.quote{display:block}.price{text-align:left;margin-top:16px}.tracker-meta{grid-template-columns:1fr}.section-row{display:block}.option-count{display:inline-block;margin-top:7px}}
</style>
<script>
function editRequest(){const x=window.currentRequest;if(!x)return;const form=document.getElementById("editForm");for(const k of ["name","phone","city","festival","service","event_date","budget","email","details"]){if(form.elements[k])form.elements[k].value=x[k]||""}const modal=document.getElementById("editModal");modal.hidden=false;form.elements.name?.focus()}
function closeEdit(){document.getElementById("editModal").hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("editModal").hidden)closeEdit()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("editModal").hidden)closeEdit()});
document.getElementById("editForm").addEventListener("submit",async e=>{e.preventDefault();const form=e.target,msg=document.getElementById("editMsg");const data=Object.fromEntries(new FormData(form));try{const r=await fetch("/api/requests/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json","X-Request-Token":token},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.detail||"Could not update request");closeEdit();await load();}catch(err){msg.textContent=err.message||"Could not update request."}});
</script><style>
.tracker-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.edit-modal{position:fixed;inset:0;background:rgba(33,27,23,.45);z-index:100;display:grid;place-items:center;padding:20px}.edit-modal[hidden]{display:none}.edit-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edit-card label{font-weight:700}.edit-card .primary{border:0;cursor:pointer}.edit-card .msg{color:var(--red,#a33b32)}@media(max-width:650px){.edit-grid{grid-template-columns:1fr}}
</style></body></html>
