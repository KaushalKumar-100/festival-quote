<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FestivalQuote Admin</title><link rel="stylesheet" href="/admin/styles.css"></head><body><main><section id="login"><h1>FestivalQuote Admin</h1><p>Private operations dashboard.</p><input id="key" type="password" placeholder="Admin key"><button onclick="openDash()">Open</button><p id="msg"></p></section><section id="dash" hidden><div id="stats"></div><h2>Requests</h2><div id="requests"></div><h2>Add provider</h2><form id="provider"><input name="name" placeholder="Name" required><input name="city" placeholder="City" required><input name="service" placeholder="Service" required><input name="phone" placeholder="Phone"><input name="source_url" placeholder="Source URL"><input name="lead_fee" type="number" value="150"><textarea name="notes" placeholder="Notes"></textarea><button>Add provider</button></form><p id="providerMsg"></p></section></main><script>let KEY="";const H=()=>({"X-Admin-Key":KEY,"Content-Type":"application/json"});async function openDash(){KEY=document.getElementById("key").value;const r=await fetch("/api/stats",{headers:H()});if(!r.ok){document.getElementById("msg").textContent="Invalid key";return}document.getElementById("login").hidden=true;document.getElementById("dash").hidden=false;refresh()}async function refresh(){const [a,b]=await Promise.all([fetch("/api/stats",{headers:H()}),fetch("/api/requests",{headers:H()})]);const s=await a.json(),q=await b.json();document.getElementById("stats").innerHTML=Object.entries(s).map(([k,v])=>"<b>"+k+": "+v+"</b>").join(" · ");document.getElementById("requests").innerHTML=q.map(x=>"<article><strong>#"+x.id+" "+x.name+"</strong><p>"+x.service+" · "+x.city+" · "+x.event_date+" · "+x.budget+"</p><p>"+x.phone+" · "+x.status+"</p><p>"+(x.details||"")+"</p></article>").join("")||"<p>No requests.</p>"}document.getElementById("provider").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/providers",{method:"POST",headers:H(),body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.getElementById("providerMsg").textContent=r.ok?"Provider added":"Could not add provider";if(r.ok)e.target.reset()})</script></body></html>
