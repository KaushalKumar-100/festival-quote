<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FestivalQuote Operations</title><link rel="stylesheet" href="/admin/styles.css"></head><body>
<main>
<section id="login" class="login"><p class="eyebrow">FESTIVALQUOTE</p><h1>Operations dashboard</h1><p>Private workspace for requests, providers, quotes and lead revenue.</p><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><button onclick="openDash()">Open dashboard</button><p id="loginMsg" class="msg"></p></section>
<section id="dash" hidden>
<header class="top"><div><a class="brand" href="/">Festival<span>Quote</span></a><p>Festival operations</p></div><button class="ghost" onclick="location.reload()">Lock</button></header>
<div id="stats" class="stats"></div>
<div class="tabs"><button class="tab active" data-tab="requestsTab">Requests</button><button class="tab" data-tab="providersTab">Providers</button><button class="tab" data-tab="quotesTab">Quote builder</button></div>
<section id="requestsTab" class="tabbody"><div class="toolbar"><input id="search" placeholder="Search name, phone, service…"><select id="statusFilter"><option value="">All statuses</option><option>new</option><option>sourcing</option><option>quotes_ready</option><option>customer_contacted</option><option>booked</option><option>closed</option><option>cancelled</option></select><button onclick="loadRequests()">Refresh</button></div><div id="requests"></div></section>
<section id="providersTab" class="tabbody" hidden><div class="panel"><h2>Add provider</h2><form id="provider"><div class="grid"><input name="name" placeholder="Provider/business name" required><input name="city" placeholder="City" required><input name="service" placeholder="Service/category" required><input name="phone" placeholder="Phone"><input name="whatsapp" placeholder="WhatsApp number"><input name="source_url" placeholder="Google Maps / website URL"><input name="lead_fee" type="number" min="0" value="150"><input name="notes" placeholder="Verification notes"></div><button>Add provider</button><p id="providerMsg" class="msg"></p></form></div><div class="toolbar"><input id="providerSearch" placeholder="Filter providers"><button onclick="loadProviders()">Refresh</button></div><div id="providers"></div></section>
<section id="quotesTab" class="tabbody" hidden><div class="panel"><h2>Create a quote</h2><p class="muted">Use this after you have contacted a provider and verified availability/price.</p><form id="quoteForm"><div class="grid"><input name="request_id" type="number" placeholder="Request ID" required><select name="provider_id" id="providerSelect" required><option value="">Select provider</option></select><input name="price" type="number" min="0" placeholder="Price ₹"><input name="lead_fee" type="number" min="0" value="150" placeholder="Lead fee ₹"><input name="package" placeholder="Package / inclusions"><select name="availability"><option>available</option><option>limited</option><option>unavailable</option><option>unknown</option></select></div><textarea name="response_note" placeholder="Provider response, timings, exclusions, delivery notes…"></textarea><button>Create quote</button><p id="quoteMsg" class="msg"></p></form></div></section>
</section></main>
<script>
let KEY="",requestsCache=[];
const H=()=>({"X-Admin-Key":KEY,"Content-Type":"application/json"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openDash(){KEY=document.getElementById("key").value;fetch("/api/stats",{headers:H()}).then(async r=>{if(!r.ok)throw 0;document.getElementById("login").hidden=true;document.getElementById("dash").hidden=false;await refreshAll()}).catch(()=>document.getElementById("loginMsg").textContent="Invalid admin key")}
async function refreshAll(){await Promise.all([loadStats(),loadRequests(),loadProviders()])}
async function loadStats(){const r=await fetch("/api/stats",{headers:H()});if(!r.ok)return;const s=await r.json();document.getElementById("stats").innerHTML=Object.entries(s).map(([k,v])=>'<div><span>'+esc(k.replaceAll("_"," "))+'</span><b>'+esc(v)+'</b></div>').join("")}
async function loadRequests(){const q=document.getElementById("search").value,status=document.getElementById("statusFilter").value;const url="/api/requests?"+new URLSearchParams({q,status});const r=await fetch(url,{headers:H()});if(!r.ok)return;requestsCache=await r.json();renderRequests()}
function renderRequests(){document.getElementById("requests").innerHTML=requestsCache.map(x=>'<article class="request"><div class="requesthead"><div><strong>#'+x.id+' '+esc(x.name)+'</strong><p>'+esc(x.festival)+' · '+esc(x.service)+' · '+esc(x.city)+' · '+esc(x.event_date)+'</p></div><select onchange="setStatus('+x.id+',this.value)">'+["new","sourcing","quotes_ready","customer_contacted","booked","closed","cancelled"].map(s=>'<option '+(s===x.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div><p><b>Budget:</b> '+esc(x.budget)+' &nbsp; <b>Phone:</b> '+esc(x.phone)+' &nbsp; <b>Quotes:</b> '+esc(x.quote_count)+'</p><p class="details">'+esc(x.details||"No extra details")+'</p><div class="actions"><button class="small" onclick="openRequest('+x.id+')">View & manage quotes</button><button class="small ghost" onclick="openTrack('+x.id+')">Open customer tracker</button></div><div id="detail-'+x.id+'" class="detail" hidden></div></article>').join("")||'<div class="empty">No matching requests.</div>'}
async function setStatus(id,status){const r=await fetch("/api/requests/"+id+"/status?status="+encodeURIComponent(status),{method:"PATCH",headers:H()});if(!r.ok)alert("Could not update status");await loadStats()}
async function openRequest(id){const el=document.getElementById("detail-"+id);if(!el.hidden){el.hidden=true;return}const r=await fetch("/api/requests/"+id,{headers:H()});const j=await r.json();el.hidden=false;el.innerHTML='<h3>Request details</h3><p>'+esc(j.request.name)+' · '+esc(j.request.phone)+' · '+esc(j.request.email||"")+'</p><p>'+esc(j.request.details||"")+'</p><h3>Quotes</h3>'+ (j.quotes.length?j.quotes.map(q=>'<div class="quoteRow"><span><b>'+esc(q.provider)+'</b><br>'+esc(q.package||"")+' · '+esc(q.availability)+'<br>'+esc(q.response_note||"")+'</span><span>₹'+(q.price??"Ask")+'<br><small>Lead ₹'+q.lead_fee+' · '+esc(q.lead_status)+'</small></span></div>').join(""):'<p>No quotes yet.</p>')+'<button class="small" onclick="prefillQuote('+id+')">Create quote for this request</button>'}
function openTrack(id){const x=requestsCache.find(r=>r.id===id);if(x)alert("The customer tracking link contains a private token. New links are returned when a request is created. Use the request response or database token to share it; do not publish it.")}
async function loadProviders(){const r=await fetch("/api/providers?include_inactive=true",{headers:H()});if(!r.ok)return;const ps=await r.json();const filter=document.getElementById("providerSearch").value.toLowerCase();const filtered=ps.filter(p=>(p.name+" "+p.city+" "+p.service).toLowerCase().includes(filter));document.getElementById("providers").innerHTML=filtered.map(p=>'<article class="provider"><div><b>'+esc(p.name)+'</b><p>'+esc(p.city)+' · '+esc(p.service)+'</p><p>'+esc(p.phone||"No phone")+' · Lead ₹'+esc(p.lead_fee)+'</p></div><div><span class="badge '+(p.active?"on":"off")+'">'+(p.active?"Active":"Inactive")+'</span><button class="small" onclick="toggleProvider('+p.id+','+(!p.active)+')">'+(p.active?"Disable":"Activate")+'</button></div></article>').join("")||'<div class="empty">No providers.</div>';const sel=document.getElementById("providerSelect");sel.innerHTML='<option value="">Select provider</option>'+ps.filter(p=>p.active).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' — '+esc(p.city)+'</option>').join("")}
async function toggleProvider(id,active){await fetch("/api/providers/"+id+"/active?active="+active,{method:"PATCH",headers:H()});loadProviders();loadStats()}
function prefillQuote(id){document.querySelector('[data-tab="quotesTab"]').click();document.querySelector('#quoteForm input[name="request_id"]').value=id;document.getElementById("quoteForm").scrollIntoView({behavior:"smooth"})}
document.getElementById("provider").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/providers",{method:"POST",headers:H(),body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.getElementById("providerMsg").textContent=r.ok?"Provider added.":"Could not add provider.";if(r.ok){e.target.reset();loadProviders();loadStats()}})
document.getElementById("quoteForm").addEventListener("submit",async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const k of ["request_id","provider_id","price","lead_fee"])if(data[k]==="")delete data[k];else if(k!=="package"&&k!=="availability"&&k!=="response_note")data[k]=Number(data[k]);const r=await fetch("/api/quotes",{method:"POST",headers:H(),body:JSON.stringify(data)});document.getElementById("quoteMsg").textContent=r.ok?"Quote created and request moved to quotes_ready.":"Could not create quote.";if(r.ok){e.target.reset();loadStats();loadRequests()}})
document.getElementById("search").addEventListener("input",renderRequests);document.getElementById("statusFilter").addEventListener("change",loadRequests);document.getElementById("providerSearch").addEventListener("input",loadProviders);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tabbody").forEach(x=>x.hidden=true);b.classList.add("active");document.getElementById(b.dataset.tab).hidden=false});
</script></body></html>
